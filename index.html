  <style>
    /* Align menu button to the right */
    .main-menu-btn {
      position: absolute;
      right: 10px;
      top: 10px;
    }

    /* Improve menu visibility and animation */
    #main-menu-state:checked+label+ul {
      display: block;
      animation: slideIn 0.3s ease-in-out;
    }

    /* Smooth slide-in animation */
    @keyframes slideIn {
      from {
        transform: translateX(20px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 998;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100%;
      background: white;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.2);
      transition: 0.3s;
      z-index: 999;
      padding: 20px;
    }

    .sidebar.active {
      left: 0;
    }

    /* Profile Section */
    .profile {
      text-align: center;
      margin-bottom: 20px;
    }

    .profile img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .profile h5 {
      margin-bottom: 5px;
    }

    .profile .sign-out {
      color: red;
      font-size: 14px;
      cursor: pointer;
    }

    /* Close Button */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      cursor: pointer;
    }

    /* Mobile Menu Toggle */
    .menu-toggle {
      font-size: 24px;
      cursor: pointer;
      margin-left: 15px;
      display: block;
    }

    .required::after {
      content: " *";
      color: red;
    }
  </style>

  <style>
    /* Custom menu overrides for primary blue */
    .sm-blue a:hover,

    .sm-blue a.highlighted,
    .sm-blue a.current,
    .sm-blue ul a:hover,
    .sm-blue ul a:active,
    .sm-blue ul a:focus,
    .sm-blue ul a.highlighted,
    .sm-blue ul a.current {
      background-color: #3699ff !important;
      color: #ffffff !important;
    }
  </style>
